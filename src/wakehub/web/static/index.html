<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wake Hub</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <div id="login" class="gate hidden">
    <form id="login-form" class="gate-card">
      <p class="eyebrow">Wake Hub</p>
      <h1>Sign in</h1>
      <p class="lede">This browser session needs the UI password. The API token is separate and stays on the settings page.</p>
      <label for="ui-password">Password</label>
      <input id="ui-password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit" data-cap="ui_login">Sign in</button>
      <p id="login-error" class="error" role="alert"></p>
    </form>
  </div>

  <div id="app" class="shell hidden">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark">WH</span>
        <div>
          <strong>Wake Hub</strong>
          <span>LAN power</span>
        </div>
      </div>
      <nav>
        <button type="button" data-page="devices" data-cap="list_devices">Devices</button>
        <button type="button" data-page="history" data-cap="list_actions">History</button>
        <button type="button" data-page="settings" data-cap="get_settings">Settings</button>
      </nav>
    </aside>
    <div class="workspace">
      <header class="topbar">
        <div>
          <p id="page-kicker" class="eyebrow">Inventory</p>
          <h1 id="page-title">Devices</h1>
        </div>
        <p id="banner" class="banner hidden" role="status"></p>
      </header>
      <main id="view"></main>
    </div>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
